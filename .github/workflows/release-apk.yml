name: Signed Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: User-visible versionName
        required: true
        default: '0.1.0'
        type: string
      release_channel:
        description: Stable releases are public; Preview releases are marked as pre-releases.
        required: true
        default: preview
        type: choice
        options:
          - preview
          - stable
      release_notes:
        description: User-facing changelog for this release.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: agentdock-release-${{ github.ref_name }}-${{ inputs.release_channel }}-${{ inputs.version_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify and publish signed APK
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Run release preflight checks
        run: ./gradlew --no-daemon --stacktrace lintDebug testDebugUnitTest

      - name: Validate app deployment configuration
        shell: bash
        env:
          OIDC_ISSUER: ${{ vars.AGENTDOCK_OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ vars.AGENTDOCK_OIDC_CLIENT_ID }}
          OIDC_REDIRECT_URI: ${{ vars.AGENTDOCK_OIDC_REDIRECT_URI }}
          OIDC_SCOPE: ${{ vars.AGENTDOCK_OIDC_SCOPE }}
          OIDC_AUDIENCE: ${{ vars.AGENTDOCK_OIDC_AUDIENCE }}
          API_BASE_URL: ${{ vars.AGENTDOCK_API_BASE_URL }}
        run: |
          set -euo pipefail
          missing=()
          for name in OIDC_ISSUER OIDC_CLIENT_ID OIDC_REDIRECT_URI OIDC_SCOPE OIDC_AUDIENCE API_BASE_URL; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions variables:'
            printf ' %s' "${missing[@]}"
            printf '\nConfigure the AgentDock Test OIDC/API variables before publishing a usable APK.\n' >&2
            exit 1
          fi

          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          def https_url(name: str) -> None:
              value = os.environ[name]
              parsed = urlsplit(value)
              if (parsed.scheme != "https" or not parsed.hostname or parsed.username is not None
                      or parsed.password is not None or parsed.query or parsed.fragment):
                  raise SystemExit(f"{name} must be an absolute HTTPS URL without credentials, query or fragment.")

          https_url("OIDC_ISSUER")
          https_url("API_BASE_URL")

          redirect = urlsplit(os.environ["OIDC_REDIRECT_URI"])
          scheme = redirect.scheme
          if (not scheme or "." not in scheme or scheme != scheme.lower()
                  or scheme in {"http", "https", "javascript", "data"}
                  or redirect.username is not None or redirect.password is not None
                  or redirect.query or redirect.fragment):
              raise SystemExit("OIDC_REDIRECT_URI must use a private-use reverse-domain scheme and contain no credentials, query or fragment.")

          if any(ch.isspace() for ch in os.environ["OIDC_CLIENT_ID"]):
              raise SystemExit("OIDC_CLIENT_ID must not contain whitespace.")
          if "openid" not in os.environ["OIDC_SCOPE"].split():
              raise SystemExit("OIDC_SCOPE must include the openid scope.")
          if any(ch.isspace() for ch in os.environ["OIDC_AUDIENCE"]):
              raise SystemExit("OIDC_AUDIENCE must not contain whitespace.")
          print("OIDC/API build configuration is present and has valid URL formats.")
          PY

      - name: Validate and prepare signing key
        shell: bash
        env:
          AGENTDOCK_KEYSTORE_BASE64: ${{ secrets.AGENTDOCK_KEYSTORE_BASE64 }}
          AGENTDOCK_KEYSTORE_PASSWORD: ${{ secrets.AGENTDOCK_KEYSTORE_PASSWORD }}
          AGENTDOCK_KEY_ALIAS: ${{ secrets.AGENTDOCK_KEY_ALIAS }}
          AGENTDOCK_KEY_PASSWORD: ${{ secrets.AGENTDOCK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$AGENTDOCK_KEYSTORE_BASE64" ]] || missing+=(AGENTDOCK_KEYSTORE_BASE64)
          [[ -n "$AGENTDOCK_KEYSTORE_PASSWORD" ]] || missing+=(AGENTDOCK_KEYSTORE_PASSWORD)
          [[ -n "$AGENTDOCK_KEY_ALIAS" ]] || missing+=(AGENTDOCK_KEY_ALIAS)
          [[ -n "$AGENTDOCK_KEY_PASSWORD" ]] || missing+=(AGENTDOCK_KEY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/agentdock-upload.jks"
          printf '%s' "$AGENTDOCK_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          keytool -list -keystore "$KEYSTORE_PATH" \
            -storepass "$AGENTDOCK_KEYSTORE_PASSWORD" \
            -alias "$AGENTDOCK_KEY_ALIAS" >/dev/null

          CSR_PATH="$RUNNER_TEMP/agentdock-signing-check.csr"
          if ! keytool -certreq -alias "$AGENTDOCK_KEY_ALIAS" \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$AGENTDOCK_KEYSTORE_PASSWORD" \
            -keypass "$AGENTDOCK_KEY_PASSWORD" \
            -file "$CSR_PATH" >/dev/null 2>&1; then
            echo "::error::The keystore and alias were found, but AGENTDOCK_KEY_PASSWORD could not unlock the private key. Check this GitHub Actions secret without sharing its value."
            exit 1
          fi
          rm -f "$CSR_PATH"
          echo "AGENTDOCK_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Validate release metadata
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid workflow run number for versionCode" >&2; exit 1; }
          [[ "$VERSION_CODE" -le 2100000000 ]] || { echo "versionCode exceeds Android's supported range" >&2; exit 1; }
          [[ "$VERSION_NAME" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]] || { echo "version_name contains unsupported characters" >&2; exit 1; }
          [[ "$RELEASE_CHANNEL" == "stable" || "$RELEASE_CHANNEL" == "preview" ]] || { echo "Unsupported release channel" >&2; exit 1; }
          if [[ "$SOURCE_BRANCH" == "test" && "$RELEASE_CHANNEL" != "preview" ]]; then
            echo "::error::The test branch can publish Preview releases only. Stable releases must come from main."
            exit 1
          fi
          if [[ -z "$(printf '%s' "$RELEASE_NOTES" | tr -d '[:space:]')" ]]; then
            echo "Release notes must not be empty" >&2
            exit 1
          fi

          if [[ "$SOURCE_BRANCH" == "test" ]]; then
            TAG="test-preview-v${VERSION_NAME}"
          else
            TAG="${RELEASE_CHANNEL}-v${VERSION_NAME}"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Choose a new version name; release tags are immutable."
            exit 1
          fi

      - name: Build signed release APK
        env:
          AGENTDOCK_KEYSTORE_PASSWORD: ${{ secrets.AGENTDOCK_KEYSTORE_PASSWORD }}
          AGENTDOCK_KEY_ALIAS: ${{ secrets.AGENTDOCK_KEY_ALIAS }}
          AGENTDOCK_KEY_PASSWORD: ${{ secrets.AGENTDOCK_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
          OIDC_ISSUER: ${{ vars.AGENTDOCK_OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ vars.AGENTDOCK_OIDC_CLIENT_ID }}
          OIDC_REDIRECT_URI: ${{ vars.AGENTDOCK_OIDC_REDIRECT_URI }}
          OIDC_SCOPE: ${{ vars.AGENTDOCK_OIDC_SCOPE }}
          OIDC_AUDIENCE: ${{ vars.AGENTDOCK_OIDC_AUDIENCE }}
          API_BASE_URL: ${{ vars.AGENTDOCK_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace \
            -PagentdockVersionCode="$VERSION_CODE" \
            -PagentdockVersionName="$VERSION_NAME" \
            -PagentdockOidcIssuer="$OIDC_ISSUER" \
            -PagentdockOidcClientId="$OIDC_CLIENT_ID" \
            -PagentdockOidcRedirectUri="$OIDC_REDIRECT_URI" \
            -PagentdockOidcScope="$OIDC_SCOPE" \
            -PagentdockOidcAudience="$OIDC_AUDIENCE" \
            -PagentdockApiBaseUrl="$API_BASE_URL" \
            assembleRelease

      - name: Verify APK signature and calculate checksum
        id: apk
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        run: |
          set -euo pipefail
          APK_SOURCE="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK_SOURCE"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK_SOURCE"

          APK_NAME="agentdock-${RELEASE_CHANNEL}-${VERSION_NAME}.apk"
          APK_PATH="$RUNNER_TEMP/$APK_NAME"
          cp "$APK_SOURCE" "$APK_PATH"
          (cd "$RUNNER_TEMP" && sha256sum "$APK_NAME" > "$APK_NAME.sha256")

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$APK_PATH.sha256" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          CHECKSUM_PATH: ${{ steps.apk.outputs.checksum_path }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SOURCE_BRANCH" == "test" ]]; then
            TAG="test-preview-v${VERSION_NAME}"
            TITLE="AgentDock Test Preview ${VERSION_NAME}"
          else
            TAG="${RELEASE_CHANNEL}-v${VERSION_NAME}"
            TITLE="AgentDock ${RELEASE_CHANNEL} ${VERSION_NAME}"
          fi

          RELEASE_ARGS=()
          if [[ "$RELEASE_CHANNEL" == "preview" || "$SOURCE_BRANCH" == "test" ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi

          gh release create "$TAG" \
            "$APK_PATH" \
            "$CHECKSUM_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "$RELEASE_NOTES" \
            "${RELEASE_ARGS[@]}"

      - name: Upload signed APK as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: agentdock-${{ github.ref_name }}-${{ inputs.release_channel }}-${{ inputs.version_name }}-${{ github.run_number }}
          path: |
            ${{ steps.apk.outputs.apk_path }}
            ${{ steps.apk.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/agentdock-upload.jks" "$RUNNER_TEMP/agentdock-signing-check.csr"
