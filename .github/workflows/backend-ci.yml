name: Backend CI

on:
  push:
    branches: [main, test]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "README.md"
      - "docs/ARCHITECTURE.md"
      - "docs/ROADMAP.md"
  pull_request:
    branches: [main, test]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "README.md"
      - "docs/ARCHITECTURE.md"
      - "docs/ROADMAP.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agentdock
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentdock"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENTDOCK_DATABASE_URL: postgresql+asyncpg://agentdock_runtime:ci-runtime-password@127.0.0.1:5432/agentdock
      AGENTDOCK_MIGRATION_DATABASE_URL: postgresql+asyncpg://agentdock_migrator:ci-migrator-password@127.0.0.1:5432/agentdock
      AGENTDOCK_TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:ci-postgres-password@127.0.0.1:5432/agentdock
      AGENTDOCK_TEST_DATABASE_URL: postgresql+asyncpg://agentdock_runtime:ci-runtime-password@127.0.0.1:5432/agentdock
      AGENTDOCK_TEST_WORKER_DATABASE_URL: postgresql+asyncpg://agentdock_worker:ci-worker-password@127.0.0.1:5432/agentdock
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q app migrations tests

      - name: Provision separated database roles
        env:
          PGPASSWORD: ci-postgres-password
        run: |
          psql -h 127.0.0.1 -U postgres -d agentdock -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE agentdock_migrator LOGIN PASSWORD 'ci-migrator-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE agentdock_runtime LOGIN PASSWORD 'ci-runtime-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE agentdock_worker LOGIN PASSWORD 'ci-worker-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE agentdock_dispatcher NOLOGIN
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT agentdock_dispatcher TO agentdock_migrator;
          GRANT CONNECT ON DATABASE agentdock TO agentdock_migrator, agentdock_runtime, agentdock_worker;
          GRANT CREATE ON DATABASE agentdock TO agentdock_migrator;
          GRANT USAGE, CREATE ON SCHEMA public TO agentdock_migrator;
          GRANT USAGE ON SCHEMA public TO agentdock_runtime, agentdock_worker;
          SQL

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Grant least-privilege runtime table access
        env:
          PGPASSWORD: ci-migrator-password
        run: |
          psql -h 127.0.0.1 -U agentdock_migrator -d agentdock -v ON_ERROR_STOP=1 <<'SQL'
          GRANT SELECT, INSERT ON TABLE tenants TO agentdock_runtime;
          GRANT SELECT, INSERT ON TABLE users TO agentdock_runtime;
          GRANT SELECT, INSERT, UPDATE
            ON TABLE auth_identities, user_sessions, session_tokens
            TO agentdock_runtime;
          GRANT SELECT, INSERT, UPDATE, DELETE
            ON TABLE tenant_memberships, tasks, task_events, idempotency_records
            TO agentdock_runtime;
          -- Worker: routing/lease table (no tenant content) plus tenant tables under RLS.
          GRANT SELECT, UPDATE ON TABLE task_dispatch TO agentdock_worker;
          GRANT SELECT ON TABLE tasks TO agentdock_worker;
          GRANT UPDATE (status, updated_at) ON TABLE tasks TO agentdock_worker;
          GRANT SELECT, INSERT ON TABLE task_events TO agentdock_worker;
          GRANT SELECT, INSERT, UPDATE ON TABLE task_receipts TO agentdock_worker;
          GRANT SELECT, INSERT, UPDATE ON TABLE task_checkpoints TO agentdock_worker;
          -- Approvals and audit: the API decides approvals; the worker requests and spends them.
          GRANT SELECT, UPDATE ON TABLE approvals TO agentdock_runtime;
          GRANT SELECT, INSERT ON TABLE audit_events TO agentdock_runtime;
          GRANT SELECT, INSERT, UPDATE ON TABLE approvals TO agentdock_worker;
          GRANT SELECT, INSERT ON TABLE audit_events TO agentdock_worker;
          -- Policy re-checks read the task creator's membership and active flag.
          GRANT SELECT ON TABLE tenant_memberships TO agentdock_worker;
          GRANT SELECT (id, is_active) ON TABLE users TO agentdock_worker;
          SQL

      - name: Verify migration head and ORM schema
        run: |
          python -m alembic current
          python -m alembic check

      - name: Run backend tests
        run: python -m pytest -q

      - name: Build backend container
        run: docker build --tag agentdock-backend:ci .
