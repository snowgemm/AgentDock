name: Backend CI

on:
  push:
    branches: [main, test]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "README.md"
      - "docs/ARCHITECTURE.md"
      - "docs/ROADMAP.md"
  pull_request:
    branches: [main, test]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "README.md"
      - "docs/ARCHITECTURE.md"
      - "docs/ROADMAP.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agentdock
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentdock"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENTDOCK_DATABASE_URL: postgresql+asyncpg://agentdock_runtime:ci-runtime-password@127.0.0.1:5432/agentdock
      AGENTDOCK_MIGRATION_DATABASE_URL: postgresql+asyncpg://agentdock_migrator:ci-migrator-password@127.0.0.1:5432/agentdock
      AGENTDOCK_TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:ci-postgres-password@127.0.0.1:5432/agentdock
      AGENTDOCK_TEST_DATABASE_URL: postgresql+asyncpg://agentdock_runtime:ci-runtime-password@127.0.0.1:5432/agentdock
      AGENTDOCK_TEST_WORKER_DATABASE_URL: postgresql+asyncpg://agentdock_worker:ci-worker-password@127.0.0.1:5432/agentdock
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q app migrations tests

      - name: Provision separated database roles
        env:
          PGPASSWORD: ci-postgres-password
        run: |
          psql -h 127.0.0.1 -U postgres -d agentdock -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE agentdock_migrator LOGIN PASSWORD 'ci-migrator-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE agentdock_runtime LOGIN PASSWORD 'ci-runtime-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE agentdock_worker LOGIN PASSWORD 'ci-worker-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE agentdock_dispatcher NOLOGIN
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          -- Supabase defines these roles by default; provide no-privilege equivalents in CI.
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          GRANT agentdock_dispatcher TO agentdock_migrator;
          GRANT CONNECT ON DATABASE agentdock TO agentdock_migrator, agentdock_runtime, agentdock_worker;
          GRANT CREATE ON DATABASE agentdock TO agentdock_migrator;
          GRANT USAGE, CREATE ON SCHEMA public TO agentdock_migrator;
          GRANT USAGE ON SCHEMA public TO agentdock_runtime, agentdock_worker;
          SQL

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Verify migration rollback and re-apply
        run: |
          python -m alembic current
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Verify migration head and ORM schema
        run: |
          python -m alembic current
          python -m alembic check

      - name: Run backend tests
        run: python -m pytest -q

      - name: Build backend container
        run: docker build --tag agentdock-backend:ci .

  deploy-supabase-test:
    name: Apply Alembic migrations to AgentDock test Supabase
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test' && vars.AGENTDOCK_DEPLOY_SUPABASE_TEST == 'enabled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: agentdock-test-supabase-schema
      cancel-in-progress: false
    env:
      AGENTDOCK_MIGRATION_DATABASE_URL: ${{ secrets.AGENTDOCK_TEST_MIGRATION_DATABASE_URL }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify target database and migration privileges
        run: |
          python - <<'PY'
          import asyncio
          import os
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy.pool import NullPool

          async def main() -> None:
              url = os.environ.get("AGENTDOCK_MIGRATION_DATABASE_URL", "")
              if not url.startswith("postgresql+asyncpg://"):
                  raise SystemExit("AGENTDOCK_TEST_MIGRATION_DATABASE_URL is missing or has the wrong SQLAlchemy URL scheme.")

              engine = create_async_engine(url, poolclass=NullPool, connect_args={"timeout": 10})
              try:
                  async with engine.connect() as conn:
                      target = (
                          await conn.execute(text(
                              "SELECT current_database(), current_user, "
                              "current_setting('server_version_num')::integer"
                          ))
                      ).one()
                      roles = (
                          await conn.execute(text("""
                              SELECT count(*) = 4 AS all_roles_exist,
                                     bool_and(NOT rolsuper AND NOT rolbypassrls
                                              AND NOT rolcreatedb AND NOT rolcreaterole) AS roles_restricted,
                                     bool_and(rolcanlogin) FILTER (
                                       WHERE rolname IN ('agentdock_migrator', 'agentdock_runtime', 'agentdock_worker')
                                     ) AS service_roles_can_login,
                                     bool_and(NOT rolcanlogin) FILTER (
                                       WHERE rolname = 'agentdock_dispatcher'
                                     ) AS dispatcher_cannot_login
                              FROM pg_roles
                              WHERE rolname IN (
                                'agentdock_migrator', 'agentdock_runtime',
                                'agentdock_worker', 'agentdock_dispatcher'
                              )
                          """))
                      ).one()
                      grants = (
                          await conn.execute(text("""
                              SELECT
                                pg_has_role('agentdock_migrator', 'agentdock_dispatcher', 'MEMBER') AS dispatcher_membership,
                                has_database_privilege('agentdock_migrator', 'postgres', 'CONNECT') AS database_connect,
                                has_database_privilege('agentdock_migrator', 'postgres', 'CREATE') AS database_create,
                                has_schema_privilege('agentdock_migrator', 'public', 'CREATE') AS schema_create
                          """))
                      ).one()

                  if target[0] != "postgres" or target[1] != "agentdock_migrator":
                      raise SystemExit("Refusing deployment: expected database=postgres and role=agentdock_migrator.")
                  if not 170000 <= target[2] < 180000:
                      raise SystemExit("Refusing deployment: target must be PostgreSQL 17.")
                  if not (roles.all_roles_exist and roles.roles_restricted
                          and roles.service_roles_can_login and roles.dispatcher_cannot_login):
                      raise SystemExit("Refusing deployment: AgentDock role flags are missing or unsafe.")
                  if not (grants.dispatcher_membership and grants.database_connect
                          and grants.database_create and grants.schema_create):
                      raise SystemExit("Refusing deployment: required migration privileges are missing.")
                  print("Supabase target, PostgreSQL version, role flags and migration grants verified.")
              finally:
                  await engine.dispose()

          asyncio.run(main())
          PY

      - name: Apply forward-only Alembic migrations
        run: python -m alembic upgrade head

      - name: Verify migration head and schema drift
        run: |
          python -m alembic current
          python -m alembic check
